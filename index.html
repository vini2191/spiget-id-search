<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Pesquise plugins do SpigotMC e copie o Resource ID para Spiget / Minepanel." />
  <title>Spiget ID Search</title>
  <link rel="preconnect" href="https://api.spiget.org" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0c0e12;
      --surface: #141820;
      --surface-2: #1a1f2a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #eef1f6;
      --muted: #8b93a7;
      --accent: #5b8def;
      --accent-soft: rgba(91, 141, 239, 0.15);
      --ok: #3dd68c;
      --radius: 14px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100dvh;
      font-family: var(--font);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(91, 141, 239, 0.12), transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 24px 16px 48px;
    }

    .wrap {
      width: min(640px, 100%);
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 12px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(145deg, var(--surface-2), var(--surface));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .logo img {
      width: 44px;
      height: 44px;
      display: block;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
    }

    .search-row svg {
      flex-shrink: 0;
      opacity: 0.55;
    }

    #q {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 1.05rem;
      font-family: inherit;
    }

    #q::placeholder { color: var(--muted); }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      opacity: 0;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }

    .spinner.on { opacity: 1; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    #status {
      margin-top: 16px;
      min-height: 1.2em;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }

    #results {
      list-style: none;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color 0.15s, background 0.15s;
    }

    .card:hover, .card:focus-within {
      border-color: rgba(91, 141, 239, 0.35);
      background: var(--surface-2);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .name {
      flex: 1;
      min-width: 0;
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      gap: 8px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }

    .meta .tag {
      max-width: 100%;
    }

    .id-pill {
      display: inline-flex;
      align-items: center;
      font-family: ui-monospace, "Cascadia Code", "SF Mono", monospace;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 10px;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
      white-space: nowrap;
    }

    .id-pill:hover { filter: brightness(1.12); }
    .id-pill.copied { color: var(--ok); }

    a.link {
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      white-space: nowrap;
    }

    a.link:hover { color: var(--text); }

    footer {
      margin-top: 36px;
      text-align: center;
      color: var(--muted);
      font-size: 0.78rem;
    }

    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true">
        <img src="logo.svg" alt="" width="44" height="44" />
      </div>
      <h1>Spiget ID Search</h1>
      <p class="sub">Digite o nome do plugin e copie o Resource ID</p>
    </header>

    <div class="search-box" role="search">
      <div class="search-row">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Ex: LuckPerms, via version, Vault…"
               enterkeyhint="search" />
        <div class="spinner" id="spinner" aria-hidden="true"></div>
      </div>
    </div>

    <p class="hint">Sugestões em tempo real · tolera espaços e erros leves de digitação</p>
    <div id="status" role="status" aria-live="polite"></div>
    <ul id="results"></ul>

    <footer>
      Dados de <a href="https://spiget.org" target="_blank" rel="noopener">Spiget</a>
      · para uso com Minepanel / SPIGET_RESOURCES
    </footer>
  </div>

  <script>
    const API = "https://api.spiget.org/v2/search/resources/";
    const UA = "SpigetIdSearch/1.2 (https://github.com/vini2191/spiget-id-search)";
    const qEl = document.getElementById("q");
    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const spinner = document.getElementById("spinner");

    let debounceTimer = null;
    let abortCtrl = null;
    let requestSeq = 0;

    function setLoading(on) {
      spinner.classList.toggle("on", on);
    }

    function formatDownloads(n) {
      if (n == null) return "—";
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1_000) return (n / 1_000).toFixed(1).replace(/\.0$/, "") + "k";
      return String(n);
    }

    function normalize(s) {
      return String(s || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "");
    }

    /** Distância de Levenshtein limitada (rápida para nomes curtos). */
    function levenshtein(a, b, max = 4) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      if (Math.abs(a.length - b.length) > max) return max + 1;
      const prev = new Array(b.length + 1);
      const cur = new Array(b.length + 1);
      for (let j = 0; j <= b.length; j++) prev[j] = j;
      for (let i = 1; i <= a.length; i++) {
        cur[0] = i;
        let rowMin = cur[0];
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
          if (cur[j] < rowMin) rowMin = cur[j];
        }
        if (rowMin > max) return max + 1;
        for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
      }
      return prev[b.length];
    }

    function scoreMatch(queryNorm, name) {
      const n = normalize(name);
      if (!queryNorm || !n) return 99;
      if (n === queryNorm) return 0;
      if (n.startsWith(queryNorm)) return 1;
      if (n.includes(queryNorm)) return 2;
      // subseqüência (v-i-a-v-e-r-s-i-o-n cobre "viaversian" parcialmente)
      let qi = 0;
      for (let i = 0; i < n.length && qi < queryNorm.length; i++) {
        if (n[i] === queryNorm[qi]) qi++;
      }
      if (qi === queryNorm.length) return 3;
      const d = levenshtein(queryNorm, n, 4);
      if (d <= 2) return 3 + d;
      if (d <= 4 && n.length > 4) return 6 + d;
      return 50 + d;
    }

    async function copyId(id, btn) {
      const label = String(id);
      try {
        await navigator.clipboard.writeText(label);
        btn.textContent = label + " ✓";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = label;
          btn.classList.remove("copied");
        }, 1200);
      } catch {
        prompt("Copie o ID:", label);
      }
    }

    function render(items) {
      resultsEl.innerHTML = "";
      for (const r of items) {
        const li = document.createElement("li");
        li.className = "card";

        const top = document.createElement("div");
        top.className = "card-top";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = r.name || "Sem nome";

        const actions = document.createElement("div");
        actions.className = "actions";

        const idBtn = document.createElement("button");
        idBtn.type = "button";
        idBtn.className = "id-pill";
        idBtn.title = "Copiar ID";
        idBtn.textContent = String(r.id);
        idBtn.addEventListener("click", () => copyId(r.id, idBtn));

        const link = document.createElement("a");
        link.className = "link";
        link.href = `https://www.spigotmc.org/resources/${r.id}/`;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "Spigot ↗";

        actions.append(idBtn, link);
        top.append(name, actions);

        const meta = document.createElement("div");
        meta.className = "meta";
        const dl = document.createElement("span");
        dl.textContent = formatDownloads(r.downloads) + " downloads";
        meta.appendChild(dl);
        if (r.tag) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = r.tag;
          meta.appendChild(tag);
        }

        li.append(top, meta);
        resultsEl.appendChild(li);
      }
    }

    async function fetchSearch(term, signal) {
      const url =
        API +
        encodeURIComponent(term) +
        "?field=name&size=15&sort=-downloads&fields=id,name,tag,downloads";
      const res = await fetch(url, {
        signal,
        headers: { "User-Agent": UA },
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      return Array.isArray(data) ? data : [];
    }

    /** Gera variantes da query para a API (espaços, trechos). */
    function queryVariants(raw) {
      const trimmed = raw.trim().replace(/\s+/g, " ");
      const noSpace = trimmed.replace(/\s+/g, "");
      const words = trimmed.split(" ").filter(Boolean);
      const set = new Set();
      if (trimmed) set.add(trimmed);
      if (noSpace && noSpace !== trimmed) set.add(noSpace);
      // primeira palavra (ex: "via" de "via versian")
      if (words.length >= 1 && words[0].length >= 2) set.add(words[0]);
      // primeiras duas coladas
      if (words.length >= 2) set.add(words[0] + words[1]);
      return [...set];
    }

    async function search(query) {
      const raw = query.trim();
      if (raw.length < 2) {
        if (abortCtrl) abortCtrl.abort();
        setLoading(false);
        resultsEl.innerHTML = "";
        statusEl.textContent = raw ? "Continue digitando…" : "";
        return;
      }

      if (abortCtrl) abortCtrl.abort();
      abortCtrl = new AbortController();
      const { signal } = abortCtrl;
      const seq = ++requestSeq;
      setLoading(true);
      statusEl.textContent = "A pesquisar…";

      const variants = queryVariants(raw);
      const queryNorm = normalize(raw);

      try {
        const batches = await Promise.all(
          variants.map((v) => fetchSearch(v, signal).catch(() => []))
        );
        if (seq !== requestSeq) return;

        const byId = new Map();
        for (const batch of batches) {
          for (const r of batch) {
            if (r && r.id != null && !byId.has(r.id)) byId.set(r.id, r);
          }
        }

        let items = [...byId.values()];
        items.sort((a, b) => {
          const sa = scoreMatch(queryNorm, a.name);
          const sb = scoreMatch(queryNorm, b.name);
          if (sa !== sb) return sa - sb;
          return (b.downloads || 0) - (a.downloads || 0);
        });

        // Filtra ruído muito irrelevante se houver bons matches
        const best = items.length ? scoreMatch(queryNorm, items[0].name) : 99;
        if (best <= 8) {
          items = items.filter((r) => scoreMatch(queryNorm, r.name) <= 12);
        }

        items = items.slice(0, 12);

        if (!items.length) {
          resultsEl.innerHTML = "";
          statusEl.textContent = "Nenhum resultado";
        } else {
          render(items);
          statusEl.textContent =
            items.length + " resultado" + (items.length === 1 ? "" : "s");
        }
      } catch (err) {
        if (err.name === "AbortError") return;
        if (seq !== requestSeq) return;
        resultsEl.innerHTML = "";
        statusEl.textContent = "Erro na pesquisa. Tente de novo.";
        console.error(err);
      } finally {
        if (seq === requestSeq) setLoading(false);
      }
    }

    qEl.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => search(qEl.value), 280);
    });

    qEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(debounceTimer);
        search(qEl.value);
      }
    });

    qEl.focus();
  </script>
</body>
</html>
